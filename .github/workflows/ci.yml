name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test-node:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22", "23"]
        include:
          # ko-qmd: Windows is a release target. Failures are recorded in
          # docs/vault-search/WINDOWS.md rather than fixed in the patch stack.
          - os: windows-latest
            node-version: "22"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite

      - run: npm install

      - name: Lint
        run: npx oxlint

      - name: Tests
        run: npx vitest run --reporter=verbose --testTimeout 60000 test/
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        env:
          CI: true

      # RuleTester-based custom oxlint rule tests run under plain node only
      # (vitest reports "No test suite found", bun rejects RuleTester).
      # The quoted glob is expanded by node's own test runner, not the shell.
      - name: oxlint rule tests
        run: node --import tsx --test 'tools/oxlint/**/*.test.ts'

  test-bun:
    name: Bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite

      - name: Verify lockfile is up-to-date
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test --timeout 60000 --preload ./src/test-preload.ts test/
        env:
          CI: true
          DYLD_LIBRARY_PATH: /opt/homebrew/opt/sqlite/lib
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu

  # ko-qmd: lex (BM25) evaluation gate. Benches bm25 alone over test/fixtures/ko-vault, five
  # fresh-index runs, and compares per-query recall@5 / reciprocal rank with the committed
  # baseline (test/fixtures/ko-vault/lex-baseline.json) by paired bootstrap. No model is
  # downloaded: the index is built without `qmd embed`. Rules: src/bench/gate.ts.
  lex-gate:
    name: Lex eval gate (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: npm install

      - name: Lex gate
        shell: bash
        run: |
          # The summary is written before the exit so a FAIL still shows its DELTA and DROP lines.
          set +e
          bash scripts/bench-lex-gate.sh 2>&1 | tee lex-gate.log
          rc=${PIPESTATUS[0]}
          { echo '```'; cat lex-gate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
        env:
          LEX_REPS: "5"

      # The gate must stay model-free. A fresh runner has no model cache, so its existence after
      # the gate means something on the update or bm25 bench path pulled a model.
      - name: No model was downloaded
        run: test ! -e "${XDG_CACHE_HOME:-$HOME/.cache}/qmd/models"

      - name: Keep per-run bench JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lex-gate-runs
          path: tmp/bench-lex-gate/*.json
          if-no-files-found: ignore

  # ko-qmd: stands in for the Electron app build (Electron 39 / ABI 140).
  # electron is installed with --no-save so git-dependency consumers, which run
  # `prepare` with devDependencies, never download the Electron binary.
  electron-smoke:
    name: Electron smoke (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm install

      - run: npm install --no-save electron@39 @electron/rebuild

      - name: Rebuild native modules for Electron ABI
        shell: bash
        run: |
          start=$(date +%s)
          npx electron-rebuild --force --only better-sqlite3
          echo "electron-rebuild took $(( $(date +%s) - start ))s"

      - name: Import SDK inside Electron
        shell: bash
        run: npx electron scripts/electron-smoke.mjs
        env:
          ELECTRON_RUN_AS_NODE: "1"
