# Windows 에서 git 태그 설치(prepare = tsc 빌드)가 되는지 본다 — 앱이 이 경로로 소비한다.
name: Windows git install
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]

jobs:
  git-install:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install from tag
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-probe" && cd "$RUNNER_TEMP/npm-probe"
          npm init -y >/dev/null
          npm i --foreground-scripts --no-audit --no-fund github:tak-bro/ko-qmd#main
          node -e "require('fs').accessSync('node_modules/ko-qmd/dist/index.js')"
      - name: pnpm install from tag
        if: always()
        shell: bash
        run: |
          npm i -g pnpm@10.17.1
          mkdir -p "$RUNNER_TEMP/pnpm-probe" && cd "$RUNNER_TEMP/pnpm-probe"
          npm init -y >/dev/null
          pnpm add --reporter=append-only --loglevel=debug "github:tak-bro/ko-qmd#main"
          node -e "require('fs').accessSync('node_modules/ko-qmd/dist/index.js')"
