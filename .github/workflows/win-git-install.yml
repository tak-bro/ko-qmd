# Windows 에서 git 태그 설치(prepare = tsc 빌드)가 되는지 본다 — 앱이 이 경로로 소비한다.
name: Windows git install
on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feat/**"]

jobs:
  git-install:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm and pnpm resolve any github.com URL through hosted-git-info and try SSH
      # first; the runner has no key, and an auth failure is not retried over https.
      # The repository is private, so anonymous https fails too. Rewrite every
      # github.com form to https with the job token at the git level.
      - name: Route github.com over https with the job token
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="https://x-access-token:${GITHUB_TOKEN}@github.com/"
          git config --global url."$AUTH".insteadOf "ssh://git@github.com/"
          git config --global --add url."$AUTH".insteadOf "git@github.com:"
          git config --global --add url."$AUTH".insteadOf "https://github.com/"
      - name: npm install from tag
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-probe" && cd "$RUNNER_TEMP/npm-probe"
          npm init -y >/dev/null
          npm i --foreground-scripts --no-audit --no-fund "git+https://github.com/tak-bro/ko-qmd.git#main"
          node -e "require('fs').accessSync('node_modules/ko-qmd/dist/index.js')"
      - name: pnpm install from tag
        if: always()
        shell: bash
        run: |
          npm i -g pnpm@10.17.1
          mkdir -p "$RUNNER_TEMP/pnpm-probe" && cd "$RUNNER_TEMP/pnpm-probe"
          npm init -y >/dev/null
          pnpm add --reporter=append-only --loglevel=debug "git+https://github.com/tak-bro/ko-qmd.git#main"
          node -e "require('fs').accessSync('node_modules/ko-qmd/dist/index.js')"
